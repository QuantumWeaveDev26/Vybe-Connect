services:
  source-init:
    image: python:3.13-slim
    restart: "no"
    command:
      - python
      - -B
      - -c
      - "exec(__import__('base64').b64decode(''))"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - app_source:/source
      - app_data:/data
    read_only: true
    mem_limit: 256m
    cpus: 0.50
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
  app:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      source-init:
        condition: service_completed_successfully
    command: ["python", "-B", "/source/e1f15d3363f045c48a1e513b1f3634a6dc1ac934/server.py", "--port", "8788"]
    user: "10001:10001"
    working_dir: /source
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TW_DEPLOYMENT: production
      TW_PUBLIC_ORIGIN: https://vybe.srv1871828.hstgr.cloud
      TW_BIND: 0.0.0.0
      TW_DATA_DIR: /var/lib/teamwave/active
      TW_SETUP_TOKEN: ${TW_SETUP_TOKEN:?Provide the private owner setup token}
      TW_AI_ENABLED: ${TW_AI_ENABLED:-false}
      TW_RECOVERY_ENABLED: ${TW_RECOVERY_ENABLED:-false}
      TW_SANDBOX: "false"
      TW_PUBLIC_REVIEW: ${TW_PUBLIC_REVIEW:-true}
    volumes:
      - app_source:/source:ro
      - app_data:/var/lib/teamwave
    expose:
      - "8788"
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-B", "/source/e1f15d3363f045c48a1e513b1f3634a6dc1ac934/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.vybe-connect.rule=Host(`vybe.srv1871828.hstgr.cloud`)
      - traefik.http.routers.vybe-connect.entrypoints=websecure
      - traefik.http.routers.vybe-connect.tls=true
      - traefik.http.routers.vybe-connect.tls.certresolver=mytlschallenge
      - traefik.http.services.vybe-connect.loadbalancer.server.port=8788
volumes:
  app_data:
  app_source:
networks:
  proxy:
    external: true
    name: n8n_default
