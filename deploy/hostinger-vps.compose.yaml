services:
  source-init:
    image: python:3.13-slim
    restart: "no"
    command:
      - python
      - -B
      - -c
      - |
          """Pinned-source initializer for an official Python container, without Git builds."""
          import hashlib
          import io
          import os
          import shutil
          import stat
          import subprocess
          import sys
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path,PurePosixPath

          COMMIT='ea9611a9b703cf9a80410293f1dacb77161650ca'
          ARCHIVE_SHA256='e74c66e09988aa8ad96988f21e67d37ecc6df815c3570fc3d86d9a640425e392'
          ARCHIVE_URL='https://codeload.github.com/QuantumWeaveDev26/Vybe-Connect/zip/'+COMMIT
          ARCHIVE_ROOT='Vybe-Connect-'+COMMIT


          def unpack(data,destination,digest=ARCHIVE_SHA256,prefix=ARCHIVE_ROOT):
              if hashlib.sha256(data).hexdigest()!=digest:raise ValueError('Release archive checksum mismatch.')
              destination=Path(destination).resolve()
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  if sum(i.file_size for i in archive.infolist())>25*1024*1024:raise ValueError('Release archive is oversized.')
                  for item in archive.infolist():
                      parts=PurePosixPath(item.filename).parts
                      if not parts or parts[0]!=prefix or '..' in parts or '\\' in item.filename or stat.S_ISLNK(item.external_attr>>16):raise ValueError('Unsafe release archive member.')
                      if len(parts)==1:continue
                      target=destination.joinpath(*parts[1:]);target.resolve().relative_to(destination)
                      if item.is_dir():target.mkdir(parents=True,exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True,exist_ok=True)
                          with archive.open(item) as source,target.open('wb') as output:shutil.copyfileobj(source,output)
                          target.chmod(0o644)
              if not (destination/'server.py').is_file() or not (destination/'static/index.html').is_file():raise ValueError('Release entry points are missing.')


          def initialize():
              active=Path('/data/active')
              if not active.exists():active.mkdir(parents=True,mode=0o700)
              os.chown(active,10001,10001)
              root=Path('/source');root.mkdir(parents=True,exist_ok=True)
              release=root/COMMIT;marker=release/'.archive-sha256'
              if release.is_dir() and marker.is_file() and marker.read_text().strip()==ARCHIVE_SHA256 and (release/'server.py').is_file():
                  print('Pinned VYBE Connect release is ready.',flush=True);return
              # Docker may create working directories while preparing a dependent container.
              if release.exists():
                  if release.is_dir() and not any(release.iterdir()):release.rmdir()
                  else: shutil.rmtree(release)
              request=urllib.request.Request(ARCHIVE_URL,headers={'User-Agent':'VYBE-Connect-pinned-release'})
              with urllib.request.urlopen(request,timeout=30) as response:data=response.read(5*1024*1024+1)
              if len(data)>5*1024*1024:raise ValueError('Release download is oversized.')
              staging=Path(tempfile.mkdtemp(prefix='release-',dir=root))
              try:
                  unpack(data,staging)
                  subprocess.run([sys.executable,'-m','pip','install','--disable-pip-version-check','--no-cache-dir','--only-binary=:all:','--require-hashes','--target',str(staging/'_vendor'),'-r',str(staging/'requirements-runtime.txt')],check=True,env=dict(os.environ,TMPDIR=str(staging)))
                  subprocess.run([sys.executable,'-B','-c','import sys;sys.path.insert(0,sys.argv[1]);import site;site.addsitedir(sys.argv[1]+"/_vendor");from pdf_text import verify_runtime;verify_runtime();from zoneinfo import ZoneInfo;ZoneInfo("Asia/Kolkata");ZoneInfo("America/New_York");print("PDF and timezone runtimes verified.")',str(staging)],check=True,env=dict(os.environ,TMPDIR=str(staging)))
                  (staging/'.archive-sha256').write_text(ARCHIVE_SHA256+'\n');staging.chmod(0o755)
                  staging.rename(release)
              finally:
                  if staging.exists():shutil.rmtree(staging)
              print('Verified VYBE Connect release initialized.',flush=True)


          if __name__=='__main__':initialize()
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - app_source:/source
      - app_data:/data
    read_only: true
    mem_limit: 256m
    cpus: 0.50
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
  app:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      source-init:
        condition: service_completed_successfully
    command: ["python", "-B", "/source/ea9611a9b703cf9a80410293f1dacb77161650ca/server.py", "--port", "8788"]
    user: "10001:10001"
    working_dir: /source
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TW_DEPLOYMENT: production
      TW_PUBLIC_ORIGIN: https://vybe.srv1871828.hstgr.cloud
      TW_BIND: 0.0.0.0
      TW_DATA_DIR: /var/lib/teamwave/active
      TW_SETUP_TOKEN: ${TW_SETUP_TOKEN:-}
      TW_AI_ENABLED: "true"
      TW_AI_PROVIDER: ${TW_AI_PROVIDER:-openai}
      TW_PLATFORM_AI_MANAGED: ${TW_PLATFORM_AI_MANAGED:-false}
      TW_BILLING_ENFORCE: ${TW_BILLING_ENFORCE:-false}
      TW_RECOVERY_ENABLED: ${TW_RECOVERY_ENABLED:-false}
      TW_SANDBOX: "false"
      TW_PUBLIC_REVIEW: ${TW_PUBLIC_REVIEW:-true}
    volumes:
      - app_source:/source:ro
      - app_data:/var/lib/teamwave
    expose:
      - "8788"
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-B", "/source/ea9611a9b703cf9a80410293f1dacb77161650ca/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.vybe-connect.rule=Host(`vybe.srv1871828.hstgr.cloud`)
      - traefik.http.routers.vybe-connect.entrypoints=websecure
      - traefik.http.routers.vybe-connect.tls=true
      - traefik.http.routers.vybe-connect.tls.certresolver=mytlschallenge
      - traefik.http.services.vybe-connect.loadbalancer.server.port=8788
volumes:
  app_data:
  app_source:
networks:
  proxy:
    external: true
    name: n8n_default
