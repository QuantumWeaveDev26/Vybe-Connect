<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5e35d6">
  <title>VYBE Connect · Website chat setup</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f3fa; color: #241b34; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { max-inline-size: 820px; margin-inline: auto; padding: clamp(24px, 6vw, 72px) clamp(16px, 4vw, 32px) 100px; }
    .back { color: #4924a6; font-size: 14px; font-weight: 650; text-underline-offset: 4px; }
    h1 { font-size: clamp(28px, 4.8vw, 42px); line-height: 1.1; letter-spacing: -.035em; margin: 22px 0 10px; }
    h2 { font-size: 19px; margin: 0 0 12px; }
    p { line-height: 1.55; margin: 0 0 12px; }
    .lead { font-size: 16px; max-inline-size: 58ch; margin-bottom: 24px; color: #575066; }
    .card { background: #fff; border: 1px solid #e2dcea; border-radius: 14px; padding: clamp(16px, 4vw, 28px); }
    pre { background: #251a39; color: #ede5ff; padding: 14px 16px; border-radius: 9px; margin: 16px 0 20px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; }
    pre:has(code:empty) { display: none; }
    .preview-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
    .secondary { background:#eee8fc; color:#4825a3; }
    .secondary:not(:disabled):hover { background:#e4d9fa; }
    details { margin-top:18px; }
    summary { cursor:pointer; padding:7px 0; font-weight:650; }
    .btn { min-block-size: 44px; background: #5e35d6; color: #fff; padding: 10px 16px; border: 0; border-radius: 9px; font: inherit; font-weight: 650; cursor: pointer; }
    .btn:not(:disabled):hover { background: #4825b3; }
    .btn:disabled { background: #ece7f4; color: #625675; cursor: default; }
    :focus-visible { outline: 2px solid #5e35d6; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Back to VYBE Connect</a>
    <h1>Website chat setup</h1>
    <section class="card" aria-labelledby="widget-embed-heading">
      <h2 id="widget-embed-heading">Add chat to your website</h2>
      <p id="widget-preview-notice" role="status"></p>
      <div class="preview-actions">
        <button class="btn" id="open-widget-preview" type="button">Preview chat</button>
        <button class="btn secondary" id="copy-widget-code" type="button">Copy install code</button>
      </div>
      <details id="widget-install-details">
        <summary>Installation details</summary>
        <p>Paste the code before <code>&lt;/body&gt;</code> on your website.</p>
        <pre><code id="widget-embed-code"></code></pre>
      </details>
    </section>
  </main>
  <script src="/widget-preview.js" defer></script>
  <script src="/widget.js" data-title="VYBE Connect Support" defer></script>
</body>
</html>
